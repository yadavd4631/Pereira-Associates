<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand surface background matching navbar -->
  <rect width="180" height="180" rx="10" fill="#FBF7EE"/>
  
  <!-- Outer copper border matching .p-brand-mark -->
  <rect x="6" y="6" width="168" height="168" rx="6" fill="none" stroke="#94652F" stroke-width="8"/>
  
  <!-- Inset inner border matching .p-brand-mark::after -->
  <rect x="20" y="20" width="140" height="140" fill="none" stroke="#94652F" stroke-width="3.5" stroke-opacity="0.45"/>
  
  <!-- P&A in Playfair Display serif matching navbar mark -->
  <text x="90" y="115" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#94652F" text-anchor="middle">P&amp;A</text>
</svg>
